# Light and dark both defined: the app follows the visitor's device setting.
# The dark colours match DARK in app.py.
[theme]
font                = "'Atkinson Hyperlegible Next', sans-serif"
baseRadius          = "10px"

[theme.light]
primaryColor        = "#1c6660"
backgroundColor     = "#f4f7f7"
secondaryBackgroundColor = "#eaf0f0"
textColor           = "#13232a"
borderColor         = "#dde6e7"

[theme.dark]
primaryColor        = "#5ec5b9"
backgroundColor     = "#0d1214"
secondaryBackgroundColor = "#232d30"
textColor           = "#ecf1f2"
borderColor         = "#2a3538"

[client]
toolbarMode = "minimal"

[server]
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false
